name: CI

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: E2E tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: qa
    # The e2e suite runs serially (fixed auth callback port), so split it across
    # runners by file instead. Each shard gets its own machine and port.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e --shard=${SHARD}/4
        env:
          SHARD: ${{ matrix.shard }}

  # Stable check name that reports the combined result of all e2e shards.
  e2e-result:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: e2e
    if: ${{ !cancelled() }}
    permissions: {}
    steps:
      - run: test "${RESULT}" = success
        env:
          RESULT: ${{ needs.e2e.result }}
